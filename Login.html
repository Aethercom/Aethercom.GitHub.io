<!DOCTYPE html>
<html lang="en" dir="ltr">
    <head>
        <title>
            Login to Aethercom
        </title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="css/style.css" rel="stylesheet" type="text/css">
    </head>
    <body>
        <header class="navbar">
            <div class="brand-font"><a href="index.html" class="normal-link">Aethercom</a></div>
            <a  class="normal-link" href="javascript:history.back()">❮ Back</a>
        </header>
<form id="form-login" action="Submitted.html" method="post">
            <fieldset class="fieldset-login">
                <legend>Personal info</legend>
                <label">First Name:</label>
                <input class="button_box" type="text" required placeholder="example: Alex" id="first_name" name="1">
                <br>
                <label>Last Name:</label>
                <input class="button_box" type="text" required placeholder="example: Parker" id="last_name" name="2">
                <label>Date of Birth</label>
                <input class="button_box" type="date">
                <label for="sex">Sexuality:</label>
                Male
                <input type="radio" name="sex" id="sex">
                Female
                <input type="radio" name="sex" id="sex">
            </fieldset>
            <br>
            <fieldset class="fieldset-login">
                <legend>User info</legend>
                <label>Email</label>
                <input class="button_box" type="email" required placeholder="example@email.com">
                <label>Phone Number</label>
                <input class="button_box" type="tel" placeholder="00 000 0000">
                <label>password</label>
                <input class="button_box" type="password" required placeholder="Don't forget your password!">
            </fieldset>
            <br>
            <fieldset class="fieldset-login">
                <legend>Accept & Send</legend>
                <label>I read & accept all <a class="normal-link" href="terms.html"><ins>Aethercom terms & conditions</ins></a>.</label>
                <input required type="checkbox">
                <input class="action-button" type="reset" value="Reset">
                <input class="action-button" type="submit" value="Send">
            </fieldset>
                </div>
            </div>
        </form>
        <br>
        <div id="loginwith">
            <div id="googlelogo">
                <img id="googleicon" src="assets/Google.png" title="Google logo" alt="google new logo">
            </div>
        </div>
        <footer  class="footer">
        <div>
            <h2 class="brand-font">Aethercom</h2>
            <p class="brand-font">Beyond the Stars</p>
            <img src="assets/images/Aethercom 2D.jpg" id="logo-footer">
        </div>
        <div>
            <h3  data-i18n="Links">Links</h3>
            <a href="index.html" class="normal-link"  data-i18n="Home">Home</a>
            <a href="#projects" class="normal-link" data-i18n="Projects">Projects</a>
            <a href="terms.html" class="normal-link"  data-i18n="Terms">Terms</a>
            <a href="About.html" class="normal-link"  data-i18n="About">About</a>
        </div>
        <div>
            <h3  data-i18n="Contact-us">Contact us</h3>
            <a href="support.html" class="normal-link" data-i18n="support">Support</a>
            <a href="https://t.me/AethercomHub" class="normal-link" data-i18n="Telegram">Telegram</a>
            <a href="mailto:Aethercom@gmail.com" class="normal-link" data-i18n="Email">Email</a>
        </div>
        <p class="copyright" data-i18n="copyright">© 2026 Aethercom. All Rights Reserved.</p>
    </footer>
    </body>
</html>
