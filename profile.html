<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aethercom | Profile</title>
    <link href="css/style.css" type="text/css" rel="stylesheet">
    <link rel="icon" type="image/png" sizes="512x512" href="./favicon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="./favicon.png">
</head>
<body>
    <header class="navbar">
        <div class="brand-font"><a href="index.html" class="normal-link"><img src="assets/svg/Aethercom Text.png" class="logo-text" alt="aethercom text logo"></a></div>
        <a class="normal-link" href="javascript:history.back()">❮ Back</a>
    </header>
    <main class="profile-main">
        <div class="profile-cover" id="previewCover"></div>
        <div class="profile-avatar">
            <img id="previewAvatar" alt="Profile picture">
            <span id="avatarInitial">A</span>
        </div>
        <div class="profile-name" id="previewName">Aethercom user</div>
        <div class="profile-user" id="previewUsername">@username</div>
        <div class="profile-bio" id="previewBio">write your biography and text.</div>
        <div class="profile-meta">
            <span class="profile-pill" id="previewLocation" style="display:none"></span>
            <span class="profile-pill">Aethercom Member</span>
        </div>
        <div class="profile-links" id="previewLinks"></div>
        <a href="profile-editor.html" class="normal-link link-edit-profile"><button class="edit-profile"  data-i18n="edit-profile">
            Edit Profile
        </button></a>
    </main>
    <script src="js/script.js"></script>
</body>
</html>
