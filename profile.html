<!DOCTYPE html>
<html lang="en" dir="ltr">
    <head>
        <title>Profile</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="css/style.css" rel="stylesheet" type="text/css">
    </head>
    <body id="body-profile">
        <header class="navbar">
            <div class="brand-font"><a href="index.html" class="normal-link">Aethercom</a></div>
            <a  class="normal-link" href="javascript:history.back()">❮ Back</a>
        </header>
        <main class="profile-page">

        <section class="profile-card">

            <div class="profile-cover"></div>

            <div class="profile-info">
                <div class="avatar">
                    <img src="assets/images/me.jpg" alt="profile">
                </div>
                <div class="profile-name">
                <span>Ali</span>
                <span class="verified-badge" title="Verified by Aethercom">
    <svg viewBox="0 0 24 24" aria-hidden="true">
        <path
            d="M12 2.5
               L14.2 3.6
               L16.6 3.4
               L18 5.4
               L20.2 6.4
               L20.6 8.8
               L22 10.8
               L21 13
               L21.2 15.4
               L19.2 17
               L18.6 19.3
               L16.2 20
               L14.3 21.5
               L12 20.8
               L9.7 21.5
               L7.8 20
               L5.4 19.3
               L4.8 17
               L2.8 15.4
               L3 13
               L2 10.8
               L3.4 8.8
               L3.8 6.4
               L6 5.4
               L7.4 3.4
               L9.8 3.6
               Z"
        />

        <path
            class="check"
            d="M7.5 12.2
               L10.4 15
               L16.6 8.8"
        />
    </svg>
</span>
</div>
                <p class="username">@Owner</p>

                <p class="bio" data-i18n="bio">
                   Wellcome to the Aethercom World 🚀
                </p>

                <div class="profile-stats">
                    <div>
                        <strong>12</strong>
                        <span data-i18n="post">Post</span>
                    </div>

                    <div>
                        <strong>128</strong>
                        <span data-i18n="followers">Followers</span>
                    </div>

                    <div>
                        <strong>64</strong>
                        <span data-i18n="following">Following</span>
                    </div>
                </div>

                <button class="edit-profile"  data-i18n="edit-profile">
                    Edit Profile
                </button>
                <br>
                <br>
                <label data-i18n="language">Language</label>
                <select onchange="changeLanguage(this.value)">
                    <option value="en">English</option>
                    <option value="ch">Français</option>
                    <option value="Fr">עברית</option>
                    <option value="Ge">中文</option>
                    <option value="He">한국어</option>
                    <option value="In">日本人</option>
                    <option value="Jp">العربية</option>
                    <option value="fa">فارسی</option>
                </select>
            </div>

        </section>

    </main>
    <script src="js/script.js"></script>
    </body>
</html>
