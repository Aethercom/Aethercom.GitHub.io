<!DOCTYPE html> <html lang="fa" dir="rtl"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Aethercom AI — Aion</title> <style> * { box-sizing: border-box; margin: 0; padding: 0; } :root { --bg: #01010f; --surface: rgba(12, 15, 31, 0.72); --surface-light: rgba(255, 255, 255, 0.045); --border: #39415e; --border-soft: rgba(57, 65, 94, 0.55); --text: #f4f7fb; --muted: #8e97ae; --green: #01db8d; --blue: #02618d; --glass: rgba(255, 255, 255, 0.035); } html, body { width: 100%; height: 100%; } body { font-family: Arial, "Segoe UI", Tahoma, sans-serif; background: radial-gradient( circle at 50% -10%, rgba(1, 219, 141, 0.07), transparent 38% ), radial-gradient( circle at 100% 100%, rgba(2, 97, 141, 0.09), transparent 35% ), var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; } /* ------------------------- Main Chat Container ------------------------- */ .chat-container { width: min(100%, 720px); height: min(92vh, 850px); display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--border-soft); border-radius: 22px; overflow: hidden; backdrop-filter: blur(28px); -webkit-backdrop-filter: blur(28px); box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.035); } /* ------------------------- Header ------------------------- */ .chat-header { min-height: 72px; padding: 0 22px; display: flex; align-items: center; justify-content: space-between; gap: 15px; background: rgba(255, 255, 255, 0.025); border-bottom: 1px solid var(--border-soft); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); } .brand { display: flex; align-items: center; gap: 11px; min-width: 0; } .ai-icon { width: 38px; height: 38px; display: flex; justify-content: center; align-items: center; border-radius: 11px; background: linear-gradient( 135deg, rgba(1, 219, 141, 0.18), rgba(2, 97, 141, 0.22) ); border: 1px solid rgba(1, 219, 141, 0.2); color: var(--green); font-size: 15px; font-weight: bold; box-shadow: inset 0 0 20px rgba(1, 219, 141, 0.04); } .brand-text { display: flex; flex-direction: column; gap: 2px; } .brand-title { font-size: 15px; font-weight: 600; color: var(--text); } .brand-subtitle { font-size: 11px; color: var(--muted); } .back-btn { color: var(--muted); text-decoration: none; font-size: 13px; padding: 8px 11px; border-radius: 9px; transition: color 0.2s ease, background 0.2s ease; } .back-btn:hover { color: var(--text); background: rgba(255, 255, 255, 0.045); } /* ------------------------- Messages ------------------------- */ .messages { flex: 1; min-height: 0; overflow-y: auto; padding: 25px 22px; display: flex; flex-direction: column; gap: 14px; scroll-behavior: smooth; } .messages::-webkit-scrollbar { width: 5px; } .messages::-webkit-scrollbar-track { background: transparent; } .messages::-webkit-scrollbar-thumb { background: #39415e; border-radius: 20px; } .msg-row { display: flex; width: 100%; } .msg-row.user { justify-content: flex-start; } .msg-row.ai { justify-content: flex-end; } .bubble { max-width: min(78%, 560px); padding: 12px 15px; border-radius: 16px; font-size: 14px; line-height: 1.9; white-space: pre-wrap; overflow-wrap: anywhere; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); } /* User */ .msg-row.user .bubble { background: linear-gradient( 135deg, rgba(255, 255, 255, 0.055), rgba(255, 255, 255, 0.025) ); color: #eef2f8; border: 1px solid rgba(57, 65, 94, 0.75); border-bottom-right-radius: 5px; box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.025); } /* AI */ .msg-row.ai .bubble { background: linear-gradient( 135deg, rgba(1, 219, 141, 0.085), rgba(2, 97, 141, 0.10) ); color: #e8fdf6; border: 1px solid rgba(1, 219, 141, 0.18); border-bottom-left-radius: 5px; box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.025); } /* ------------------------- Welcome Message ------------------------- */ .welcome { width: 100%; display: flex; justify-content: center; padding: 25px 10px 10px; text-align: center; } .welcome-content { max-width: 430px; } .welcome-logo { width: 54px; height: 54px; margin: 0 auto 13px; display: flex; align-items: center; justify-content: center; border-radius: 16px; background: linear-gradient( 135deg, rgba(1, 219, 141, 0.12), rgba(2, 97, 141, 0.16) ); border: 1px solid rgba(57, 65, 94, 0.75); color: var(--green); font-weight: 600; box-shadow: 0 8px 35px rgba(1, 219, 141, 0.06); } .welcome h1 { font-size: 18px; font-weight: 600; margin-bottom: 7px; } .welcome p { color: var(--muted); font-size: 12px; line-height: 1.8; } /* ------------------------- Input Area ------------------------- */ .input-area { padding: 14px 16px 16px; display: flex; align-items: center; gap: 9px; background: rgba(255, 255, 255, 0.025); border-top: 1px solid var(--border-soft); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); } .input-wrapper { flex: 1; display: flex; align-items: center; background: rgba(255, 255, 255, 0.035); border: 1px solid rgba(57, 65, 94, 0.8); border-radius: 13px; transition: border-color 0.2s ease, background 0.2s ease, box-shadow 0.2s ease; } .input-wrapper:focus-within { border-color: rgba(1, 219, 141, 0.42); background: rgba(255, 255, 255, 0.045); box-shadow: 0 0 0 3px rgba(1, 219, 141, 0.035); } input { width: 100%; padding: 13px 14px; background: transparent; border: none; outline: none; color: var(--text); font-family: inherit; font-size: 14px; } input::placeholder { color: #737c94; } .send-btn { width: 48px; height: 46px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border: 1px solid rgba(1, 219, 141, 0.25); border-radius: 12px; background: linear-gradient( 135deg, rgba(1, 219, 141, 0.14), rgba(2, 97, 141, 0.20) ); color: var(--green); cursor: pointer; transition: transform 0.2s ease, background 0.2s ease, border-color 0.2s ease; } .send-btn:hover { transform: translateY(-1px); background: linear-gradient( 135deg, rgba(1, 219, 141, 0.21), rgba(2, 97, 141, 0.27) ); border-color: rgba(1, 219, 141, 0.4); } .send-btn:active { transform: translateY(0); } .send-icon { font-size: 17px; transform: rotate(180deg); } /* ------------------------- Mobile ------------------------- */ @media (max-width: 650px) { body { align-items: stretch; } .chat-container { width: 100%; height: 100vh; max-width: none; border-radius: 0; border: none; box-shadow: none; } .chat-header { min-height: 66px; padding: 0 15px; } .messages { padding: 20px 14px; } .bubble { max-width: 86%; font-size: 14px; } .input-area { padding: 10px; padding-bottom: max(10px, env(safe-area-inset-bottom)); } .back-btn { font-size: 12px; } } </style> </head> <body> <div class="chat-container"> <!-- Header --> <header class="chat-header"> <div class="brand"> <div class="ai-icon"> AI </div> <div class="brand-text"> <div class="brand-title"> Aethercom AI </div> <div class="brand-subtitle"> Aion · هوش مصنوعی Aethercom </div> </div> </div> <a href="index.html" class="back-btn"> بازگشت ← </a> </header> <!-- Messages --> <main class="messages" id="chatBox"> <div class="welcome"> <div class="welcome-content"> <div class="welcome-logo"> Aion </div> <h1> Aion </h1> <p> دستیار هوشمند Aethercom؛ آماده برای گفتگو، پاسخ‌گویی و کمک به شما. </p> </div> </div> </main> <!-- Input --> <div class="input-area"> <div class="input-wrapper"> <input type="text" id="userInput" placeholder="پیامتان را بنویسید..." autocomplete="off" > </div> <button class="send-btn" id="sendButton" type="button" aria-label="ارسال پیام" > <span class="send-icon">➤</span> </button> </div> </div> <script> /* * آدرس Worker کلودفلر خودتان را اینجا قرار دهید. */ const workerUrl = "https://curly-art-7001.galaxy-2023-ultra.workers.dev/"; const inputField = document.getElementById("userInput"); const sendButton = document.getElementById("sendButton"); const chatBox = document.getElementById("chatBox"); /* * اضافه کردن پیام به چت * از innerHTML برای متن کاربر استفاده نمی‌کنیم * تا محتوای HTML یا Script اجرا نشود. */ function addMessage(text, type) { const row = document.createElement("div"); row.className = `msg-row ${type}`; const bubble = document.createElement("div"); bubble.className = "bubble"; bubble.textContent = text; row.appendChild(bubble); chatBox.appendChild(row); chatBox.scrollTop = chatBox.scrollHeight; return row; } /* * ارسال پیام */ async function sendMessage() { const message = inputField.value.trim(); if (!message) { return; } /* * نمایش پیام کاربر */ addMessage(message, "user"); inputField.value = ""; inputField.focus(); /* * نمایش وضعیت پاسخ‌گویی */ const loadingRow = addMessage( "Aion در حال پاسخ‌گویی...", "ai" ); try { const response = await fetch( workerUrl, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ message: message }) } ); if (!response.ok) { throw new Error( `HTTP ${response.status}` ); } const data = await response.json(); /* * حذف Loading */ loadingRow.remove(); /* * پاسخ Aion */ addMessage( data.reply || "پاسخی دریافت نشد.", "ai" ); } catch (error) { loadingRow.remove(); const errorRow = addMessage( "خطا: امکان برقراری ارتباط با Aion وجود ندارد.", "ai" ); errorRow .querySelector(".bubble") .style.color = "#ff9b9b"; errorRow .querySelector(".bubble") .style.borderColor = "rgba(255, 100, 100, 0.22)"; console.error( "Aion Error:", error ); } chatBox.scrollTop = chatBox.scrollHeight; } /* * Enter برای ارسال */ inputField.addEventListener( "keydown", function (event) { if ( event.key === "Enter" && !event.shiftKey ) { event.preventDefault(); sendMessage(); } } ); /* * دکمه ارسال */ sendButton.addEventListener( "click", sendMessage ); </script> </body> </html>
